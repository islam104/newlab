spring.application.name=newsem

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/newsem_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=${PORT:8080}

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
# 32-byte Base64 keys (can be overridden with env JWT_ACCESS_SECRET / JWT_REFRESH_SECRET)
security.jwt.access-secret=${JWT_ACCESS_SECRET:${SECURITY_JWT_SECRET:wrz9XyUgLd+fcAEU+E4yjjdg9ec+icxPJ4B/IUnoViI=}}
security.jwt.refresh-secret=${JWT_REFRESH_SECRET:${SECURITY_JWT_SECRET:U+/ajsL24zZRHCaUUv8ZZ1S21VHXzKjIff8uXG5w1Os=}}
security.jwt.access-expiration-minutes=${JWT_ACCESS_TTL_MINUTES:15}
security.jwt.refresh-expiration-days=${JWT_REFRESH_TTL_DAYS:7}

# Ticket signature
signature.key-store-path=${SIGNATURE_KEYSTORE_PATH:./.secrets/signature/ticket-signing.p12}
signature.key-store-type=${SIGNATURE_KEYSTORE_TYPE:PKCS12}
signature.key-store-password=${SIGNATURE_KEYSTORE_PASSWORD:changeit}
signature.key-alias=${SIGNATURE_KEY_ALIAS:ticket-signing}
signature.key-password=${SIGNATURE_KEY_PASSWORD:${SIGNATURE_KEYSTORE_PASSWORD:changeit}}
signature.algorithm=${SIGNATURE_ALGORITHM:SHA256withRSA}
signature.verification-public-cert-base64=${SIGNATURE_PUBLIC_CERT_BASE64:}
security.ticket.ttl-seconds=${TICKET_TTL_SECONDS:300}

# Object storage (MinIO)
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.access-key=${STORAGE_ACCESS_KEY:newsem-service}
storage.secret-key=${STORAGE_SECRET_KEY:newsem-service-secret}
storage.bucket=${STORAGE_BUCKET:malware-signatures}
storage.presigned-url-expiry-minutes=${STORAGE_PRESIGNED_URL_EXPIRY_MINUTES:60}
storage.first-bytes-length=${STORAGE_FIRST_BYTES_LENGTH:16}
